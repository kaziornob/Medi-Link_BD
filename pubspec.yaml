name: medi_link_bd
description: "A comprehensive healthcare super app for Bangladesh connecting patients with doctors."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Design
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  animate_do: ^3.3.4
  flutter_spinkit: ^5.2.0
  badges: ^3.1.2
  shimmer: ^3.0.0
  lottie: ^2.7.0
  intl: ^0.19.0

  # State Management
  get: ^4.6.6
  getx_storage: ^2.1.1

  # Networking & API
  http: ^1.2.0
  dio: ^5.3.1
  connectivity_plus: ^5.0.2

  # Image & Media
  cached_network_image: ^3.3.1
  image_picker: ^1.0.4
  video_player: ^2.8.1

  # Local Storage
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  path: ^1.8.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Utilities
  url_launcher: ^6.2.5
  uuid: ^4.0.0
  crypto: ^3.0.3
  device_info_plus: ^9.1.0
  package_info_plus: ^5.0.1
  local_auth: ^2.1.6

  # Date & Time
  date_picker_timeline: ^1.2.5
  flutter_native_timezone: ^0.3.0

  # Analytics & Logging
  firebase_core: ^2.24.0
  firebase_analytics: ^10.7.0
  firebase_crashlytics: ^3.3.0
  logger: ^2.0.1

  # Testing & Quality
  freezed_annotation: ^2.4.1
  json_serializable: ^6.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  freezed: ^2.4.1
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/mock_data.json
    - assets/i18n/en.json
    - assets/i18n/bn.json

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
